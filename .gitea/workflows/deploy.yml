name: Build and Deploy Harbor-Ops

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: elaamj
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: elaamj/harbor-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: elaamj/harbor-frontend:latest

      - name: Build and push db
        uses: docker/build-push-action@v4
        with:
          context: ./db
          push: true
          tags: elaamj/harbor-db:latest

      - name: Deploy to K3s
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no k3s@192.168.1.10 "kubectl rollout restart deployment/harbor-backend deployment/harbor-frontend -n harbor-ops"
