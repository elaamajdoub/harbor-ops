name: Build and Deploy Harbor-Ops

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: elaamj
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: elaamj/harbor-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: elaamj/harbor-frontend:latest

      - name: Build and push db
        uses: docker/build-push-action@v4
        with:
          context: ./db
          push: true
          tags: elaamj/harbor-db:latest

      - name: Deploy to K3s
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 192.168.1.10
          username: k3s
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl rollout restart deployment/harbor-backend -n harbor-ops
            kubectl rollout restart deployment/harbor-frontend -n harbor-ops
            kubectl rollout restart deployment/harbor-db -n harbor-ops
